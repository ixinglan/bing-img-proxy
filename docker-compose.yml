services:
  bing-img-proxy:
    build: .
    # 锁死目标平台，避免在本机(ARM64 Mac)构建时把 ARM 版二进制打进镜像，
    # 导致在 x86_64 云服务器上启动报 "exec format error"。
    # 若云服务器本身是 ARM64(aarch64)，请改成 linux/arm64。
    platform: linux/amd64
    image: bing-img-proxy:latest
    ports:
      - "18088:18088"
    volumes:
      # 挂载配置目录：改 image_ids.txt / origins.txt 无需重建镜像
      - ./config:/app/config:ro
      # 挂载图片池磁盘缓存：容器重建/重启后已下载的图片仍可复用，无需重新回源
      - ./cache:/app/cache
    environment:
      - ROUTE_PATH=/api/bg/random
      - BING_BASE_URL=https://cn.bing.com/th?id=
      # 图片池接口（/api/bg/image）：预留就绪张数 + 浏览器缓存时长（秒）
      - POOL_SIZE=5
      - POOL_CACHE_MAX_AGE=86400
      # 磁盘缓存文件对数上限（LRU 淘汰），默认 = POOL_SIZE*4 = 20
      # 注意：这是「磁盘最多留几份」的安全上限，不是热池大小；设 0 表示不限制
      - CACHE_MAX_FILES=20
      # 回源缩图参数。留空（或不写这一行）= 取原图，最清晰，但流量最大（Bing 原图可能 3MB+）。
      # 想省流量再打开下面这行：背景是 cover 铺满视口，需要「视口 CSS 尺寸 x DPR」个设备像素，
      # 1080p 在 Retina 上会被放大 1.5 倍以上而发虚，故建议给足尺寸。
      # 实测 3840x2160：1.13MB（原图 3.68MB），肉眼看不出画质差异，耗时也几乎不变。
      - BING_IMAGE_PARAMS=
      # - BING_IMAGE_PARAMS=w=3840&h=2160&c=7&rs=1
      # 改这个参数后缓存会自动失效（缓存 key 含参数），旧文件会被 LRU 逐步淘汰，无需手动清理。
      # 原 302 接口是否也套用缩图参数：默认 0，保持原接口行为完全不变
      - RESIZE_ON_REDIRECT=0
      # POOL_ROUTE_PATH 默认 /api/bg/image，一般无需修改
      # CONFIG_DIR 默认 /app/config，一般情况无需修改
    restart: unless-stopped
